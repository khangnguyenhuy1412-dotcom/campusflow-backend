server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campusflow-backend

  # Load local variables from .env (if present) so ./mvnw spring-boot:run works without exporting them
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusflow_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USER:campusflow_user}
    password: ${DB_PASSWORD:campusflow_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        # Loads lazy collections (e.g. item images) for a whole page in one query instead of one per row
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Defaults point at Mailpit from docker-compose; set these in .env for a real SMTP server.
  # 127.0.0.1 instead of localhost: on Windows "localhost" tries IPv6 first and Docker only listens on IPv4
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    # Required, at least 32 bytes. No default on purpose: the app must not start with a guessable key.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:campusflow}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  mail:
    from: ${MAIL_FROM:CampusFlow <no-reply@campusflow.local>}
  student-email:
    # Email domains accepted at sign-up; "edu.vn" matches any *.edu.vn domain
    allowed-domain-suffixes: ${STUDENT_EMAIL_DOMAINS:edu.vn}
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./uploads}
    # Must match the "/uploads/**" rule in SecurityConfig
    public-url-prefix: /uploads
  verification:
    code-ttl: 10m
    max-attempts: 5
    resend-cooldown: 60s
